<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b3a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#b6f23a"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76b900" stop-opacity=".35"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- stock charts -->
  <g transform="translate(0,210)">
    <path d="M0 880 L160 830 L300 860 L460 760 L600 800 L760 690 L900 730 L1060 610 L1200 650 L1360 520 L1500 560 L1660 430 L1800 470 L1920 380 V1080 H0 Z" fill="url(#fill)"/>
    <path d="M0 880 L160 830 L300 860 L460 760 L600 800 L760 690 L900 730 L1060 610 L1200 650 L1360 520 L1500 560 L1660 430 L1800 470 L1920 380" fill="none" stroke="url(#green)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 960 L200 930 L380 950 L560 880 L760 910 L960 840 L1160 870 L1360 790 L1560 820 L1760 740 L1920 760" fill="none" stroke="#5ac8fa" stroke-opacity=".6" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 1010 L240 990 L440 1000 L660 950 L880 975 L1100 920 L1320 940 L1540 890 L1760 905 L1920 870" fill="none" stroke="#ffb84d" stroke-opacity=".5" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- ticker chips -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="700">
    <g transform="translate(1380,150)"><rect width="170" height="60" rx="30" fill="#76b900" fill-opacity=".15" stroke="#76b900" stroke-width="2"/><text x="85" y="40" text-anchor="middle" fill="#b6f23a">AAPL ▲</text></g>
    <g transform="translate(1570,150)"><rect width="190" height="60" rx="30" fill="#5ac8fa" fill-opacity=".15" stroke="#5ac8fa" stroke-width="2"/><text x="95" y="40" text-anchor="middle" fill="#5ac8fa">NVDA ▲</text></g>
    <g transform="translate(1480,230)"><rect width="190" height="60" rx="30" fill="#ffb84d" fill-opacity=".15" stroke="#ffb84d" stroke-width="2"/><text x="95" y="40" text-anchor="middle" fill="#ffb84d">MSFT ▲</text></g>
    <g transform="translate(1690,230)"><rect width="140" height="60" rx="30" fill="#ffffff" fill-opacity=".08" stroke="#fff" stroke-opacity=".4" stroke-width="2"/><text x="70" y="40" text-anchor="middle" fill="#fff">…</text></g>
  </g>

  <!-- text -->
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="120" y="190" font-size="34" font-weight="700" letter-spacing="8" fill="#76b900">NEMOCLAW + DEEPAGENTS · ROUND 3</text>
    <text x="120" y="400" font-size="170" font-weight="800" fill="#ffffff">Let’s Go</text>
    <text x="120" y="570" font-size="170" font-weight="800" fill="url(#green)">Multi-Stock!</text>
    <text x="120" y="660" font-size="44" fill="#c9d1e8">One prompt. A dropdown of tickers. Dark mode, too.</text>
    <rect x="120" y="710" width="140" height="8" rx="4" fill="url(#green)"/>
    <text x="120" y="790" font-size="30" fill="#8d97b8" font-family="DejaVu Sans Mono, monospace">nemotron-3.5-super-vl-120b-a12b on NIM</text>
  </g>
</svg>
